# 11 historical East-Africa flood events (GHACOF73 side event)
# Source: github.com/icpac-igad/DevOps-hazard-modeling#flood-events
#
# Each event is replayed as a 15-day BN-IBF window using the WeatherBench2
# archived ECMWF IFS-ENS forecast (--forecast-source ifs_ens_wb2) for the
# forecast nodes and IMERG for the antecedent nodes. The run window is
# derived as [peak_date - 5, peak_date + 9] (15 days), matching the
# operational Mar-2026 layout where the event sat at ~day 6 of 15.
#
# peak_date is best-known (month-level from the source + known event onset);
# refine against EM-DAT / DesInventar and the 9-day post-event tail absorbs
# any slippage. window_pre / window_post override the default 5/9 if a given
# event needs a different framing.

defaults:
  window_pre: 5      # days before peak (inclusive start = peak - window_pre)
  window_post: 9     # days after peak  (inclusive end   = peak + window_post)
  rp_years: 2
  cost_loss_ratio: 0.20

events:
